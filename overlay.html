<!doctype html>
<html><head><meta charset="utf-8">
<title>OBS GPS Overlay</title>
<style>
html,body{margin:0;width:100%;height:100%;background:#000;overflow:hidden;font-family:system-ui,sans-serif}
iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.box{position:absolute;background:rgba(0,0,0,.65);color:#fff;pointer-events:none;text-shadow:0 0 8px #000;
  border-radius:1.5vw;transition:padding .8s ease}

/* ---- GPS box (bottom-left) ---- */
#hud{left:2vw;bottom:3vh;display:flex;align-items:center;padding:1.5vw 2.5vw}
#spd{font-size:13vw;font-weight:800;line-height:.9;min-width:17vw;text-align:right;
  transition:font-size .8s ease,min-width .8s ease}
.u{font-size:3.6vw;font-weight:600;opacity:.85;margin-left:.6vw;transition:font-size .8s ease}
#info{display:flex;flex-direction:column;gap:.6vw;margin-left:2.5vw;max-width:50vw;max-height:30vw;
  overflow:hidden;white-space:nowrap;
  transition:max-width .8s ease,max-height .8s ease,margin-left .8s ease,opacity .6s ease}
#dir{font-size:5.5vw;font-weight:700;line-height:1}
#alt{font-size:4vw;font-weight:600;line-height:1}
#cty{font-size:3.6vw;font-weight:600;line-height:1.1;opacity:.95}

/* ---- Time / weather box (top-right) ---- */
#clk{right:2vw;top:3vh;padding:1.2vw 2vw;text-align:right}
#time{font-size:6vw;font-weight:800;line-height:1;transition:font-size .8s ease}
#date{font-size:3vw;font-weight:600;line-height:1;margin-top:.5vw;max-height:5vw;overflow:hidden;
  transition:max-height .8s ease,margin-top .8s ease,opacity .6s ease}
#wx{font-size:3.4vw;font-weight:600;line-height:1;margin-top:.5vw;white-space:nowrap;transition:font-size .8s ease}
#desc{display:inline-block;vertical-align:bottom;max-width:30vw;overflow:hidden;
  transition:max-width .8s ease,opacity .6s ease}

/* ---- Compact mode: speed only, and time + temperature only ---- */
.compact #hud{padding:1vw 1.8vw}
.compact #spd{font-size:9vw;min-width:11.5vw}
.compact .u{font-size:2.6vw}
.compact #info{max-width:0;max-height:0;margin-left:0;opacity:0}
.compact #clk{padding:1vw 1.6vw}
.compact #time{font-size:4.6vw}
.compact #date{max-height:0;margin-top:0;opacity:0}
.compact #wx{font-size:3.6vw}
.compact #desc{max-width:0;opacity:0}
</style></head>
<body>
<!-- Stream ID comes from the address: overlay.html?id=yourID -->
<iframe id="v" allow="autoplay"></iframe>
<div id="hud" class="box">
  <div><span id="spd">--</span><span class="u">MPH</span></div>
  <div id="info">
    <div id="dir">--</div>
    <div id="alt">-- ft</div>
    <div id="cty">Waiting for GPS...</div>
  </div>
</div>
<div id="clk" class="box">
  <div id="time">--:--</div>
  <div id="date"></div>
  <div id="wx"><span id="tmp"></span><span id="desc"></span></div>
</div>
<script>
const frame = document.getElementById('v');
const Q = new URLSearchParams(location.search);
const ID = Q.get('id') || '';
if (ID) frame.src = 'https://vdo.ninja/?view=' + encodeURIComponent(ID) + '&clean&autostart';

// Seconds in full-detail mode and in compact mode; change with &full=5&small=30 in the address
const FULL = (+Q.get('full') || 5) * 1000, SMALL = (+Q.get('small') || 30) * 1000;
function cycle(compact){
  document.body.classList.toggle('compact', compact);
  setTimeout(() => cycle(!compact), compact ? SMALL : FULL);
}
cycle(false);

const dirs = ['N','NE','E','SE','S','SW','W','NW'];
let g = null, lastHdg = null;

addEventListener('message', e => {
  if (e.source !== frame.contentWindow) return;
  const d = e.data && e.data.dataReceived;
  if (d && d.gps) { g = d.gps; g.rx = Date.now(); render(); }
});

function render(){
  const spd = document.getElementById('spd'), dir = document.getElementById('dir'),
        alt = document.getElementById('alt'), cty = document.getElementById('cty');
  if (!g || Date.now() - g.rx > 6000){
    spd.textContent = '--'; dir.textContent = '--'; alt.textContent = '-- ft';
    cty.textContent = g ? 'GPS signal lost' : (ID ? 'Waiting for GPS...' : 'Add ?id=yourID to the address');
    return;
  }
  const mph = g.mph == null ? 0 : (g.mph < 1 ? 0 : Math.round(g.mph));
  spd.textContent = mph;
  // heading is only trustworthy while moving; otherwise keep the last good one
  if (g.hdg != null && !isNaN(g.hdg) && mph >= 2) lastHdg = g.hdg;
  dir.textContent = lastHdg == null ? '--' : dirs[Math.round(lastHdg / 45) % 8] + ' ' + Math.round(lastHdg) + '\u00b0';
  alt.textContent = g.alt == null ? '-- ft' : Math.round(g.alt).toLocaleString() + ' ft';
  cty.textContent = g.county || 'Locating...';
}
setInterval(render, 1000);

// Clock uses the phone's time zone (sent with the GPS data) so it stays right if you travel
function tick(){
  const tz = g && g.tz ? g.tz : undefined;
  const now = new Date();
  let t, d;
  try{
    t = now.toLocaleTimeString('en-US', {hour:'numeric', minute:'2-digit', timeZone:tz});
    d = now.toLocaleDateString('en-US', {weekday:'short', month:'short', day:'numeric', timeZone:tz});
  }catch(e){
    t = now.toLocaleTimeString([], {hour:'numeric', minute:'2-digit'});
    d = now.toLocaleDateString();
  }
  document.getElementById('time').textContent = t;
  document.getElementById('date').textContent = d;
  const has = g && g.temp != null;
  document.getElementById('tmp').textContent = has ? Math.round(g.temp) + '\u00b0F' : '';
  document.getElementById('desc').textContent = has && g.wx ? ' \u00b7 ' + g.wx : '';
}
setInterval(tick, 1000); tick();
</script>
</body></html>
